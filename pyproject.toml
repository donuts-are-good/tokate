[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-donor"
version = "0.1.0"
description = "Donate local Codex runs to a project's task queue"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
compute-donor = "compute_donor.cli:main"

[tool.setuptools.packages.find]
include = ["compute_donor*"]
