name: Tokate coordination
on:
  workflow_call:
    inputs:
      archive_url:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
      member:
        required: true
        type: string
permissions: {}
jobs:
  coordinate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/tokate ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: tokate-coordinate-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - &bootstrap
        name: Fetch pinned coordinator
        env:
          TOKATE_ARCHIVE_URL: ${{ inputs.archive_url }}
          TOKATE_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          TOKATE_MEMBER: ${{ inputs.member }}
        run: |
          set -eu
          test "$TOKATE_ARCHIVE_URL" = "https://api.github.com/repos/obselate/tokate/releases/assets/${TOKATE_ARCHIVE_URL##*/}"
          case "${TOKATE_ARCHIVE_URL##*/}" in ''|*[!0-9]*) exit 1;; esac
          test "${#TOKATE_ARCHIVE_SHA256}" -eq 64
          case "$TOKATE_ARCHIVE_SHA256" in *[!0-9a-f]*) exit 1;; esac
          printf '%s\n' "$TOKATE_MEMBER" | grep -Eq '^tokate-[0-9]+\.[0-9]+\.[0-9]+-linux-x64/tokate$'
          curl -qfsSL --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 134217728 -H 'Accept: application/octet-stream' "$TOKATE_ARCHIVE_URL" -o "$RUNNER_TEMP/tokate.tar.gz"
          printf '%s  %s\n' "$TOKATE_ARCHIVE_SHA256" "$RUNNER_TEMP/tokate.tar.gz" | sha256sum -c -
          tar -xOzf "$RUNNER_TEMP/tokate.tar.gz" "$TOKATE_MEMBER" > "$RUNNER_TEMP/tokate"
          chmod 755 "$RUNNER_TEMP/tokate"
      - name: Coordinate bounded GitHub request
        env:
          GH_TOKEN: ${{ github.token }}
          TOKATE_REPOSITORY: ${{ github.repository }}
        run: '"$RUNNER_TEMP/tokate" coordinate --repo "$TOKATE_REPOSITORY" --event "$GITHUB_EVENT_PATH" --traffic'
  admit:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: tokate-admission-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - *bootstrap
      - name: Admit canonical pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TOKATE_REPOSITORY: ${{ github.repository }}
        run: '"$RUNNER_TEMP/tokate" admit --repo "$TOKATE_REPOSITORY" --event "$GITHUB_EVENT_PATH" --traffic'
