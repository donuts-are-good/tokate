name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap clang zlib1g-dev
      - name: Permit bubblewrap user namespaces
        run: |
          sudo tee /etc/apparmor.d/bwrap <<'EOF'
          abi <abi/4.0>,
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      - name: Install pinned native Codex
        run: |
          curl -qfsSL --proto '=https' --proto-redir '=https' https://github.com/openai/codex/releases/download/rust-v0.160.0/codex-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/codex.tar.gz"
          echo "306865417d4ee7a927785852910a527f41e1e159add390ac5ae3accb67d44a13  $RUNNER_TEMP/codex.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/codex.tar.gz" -C "$RUNNER_TEMP" codex-x86_64-unknown-linux-musl
          sudo install -m 755 "$RUNNER_TEMP/codex-x86_64-unknown-linux-musl" /usr/local/bin/codex
      - run: bash scripts/build.sh
      - run: artifacts/linux-x64/tokate --version
      - run: python3 scripts/native-proof.py
      - run: git diff --check
      - name: Probe the real managed sandbox without inference
        run: artifacts/linux-x64/tokate doctor
      - run: tar -czf "$RUNNER_TEMP/tokate-binaries.tar.gz" -C artifacts linux-x64/tokate tests/tokate-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tokate-binaries
          path: ${{ runner.temp }}/tokate-binaries.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  suite:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Permit bubblewrap user namespaces
        run: |
          sudo tee /etc/apparmor.d/bwrap <<'EOF'
          abi <abi/4.0>,
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tokate-binaries
          path: ${{ runner.temp }}
      - run: mkdir -p artifacts && tar -xzf "$RUNNER_TEMP/tokate-binaries.tar.gz" -C artifacts
      - name: Run four test shards
        shell: bash
        env:
          CI_GROUP: ${{ matrix.group }}
        run: |
          pids=()
          trap 'jobs -pr | xargs -r kill 2>/dev/null || true' EXIT
          for offset in 0 1 2 3; do
            shard=$((CI_GROUP * 4 + offset))
            TOKATE_CI_SHARD="$shard/16" artifacts/tests/tokate-tests >"$RUNNER_TEMP/shard-$shard.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for offset in 0 1 2 3; do
            shard=$((CI_GROUP * 4 + offset))
            if ! wait "${pids[$offset]}"; then
              failed=1
            fi
            cat "$RUNNER_TEMP/shard-$shard.log"
          done
          exit "$failed"
  verify:
    if: ${{ always() }}
    needs: [build, suite]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: test '${{ needs.build.result }}' = success && test '${{ needs.suite.result }}' = success
